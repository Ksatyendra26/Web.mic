<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Microphone to Speaker</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #121212; color: white; }
    button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; background: #007bff; color: white; }
    button:disabled { background: #555; }
    .status { margin-top: 20px; font-weight: bold; color: #4CAF50; }
  </style>
</head>
<body>

  <h1>Wireless Web Microphone</h1>
  <p>Connect your device to your Bluetooth Soundbar via system settings, then tap start.</p>
  
  <button id="startBtn">Turn Mic ON</button>
  <button id="stopBtn" disabled>Turn Mic OFF</button>
  
  <div class="status" id="status">Status: Disconnected</div>

  <script>
    let audioContext;
    let micStream;
    let globalSource;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('status');

    startBtn.addEventListener('click', async () => {
      try {
        // Request mic access with low latency settings
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: true,
            latency: 0
          }
        });

        // Initialize Web Audio Context
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        globalSource = audioContext.createMediaStreamSource(micStream);
        
        // Direct stream output to system speaker/Bluetooth destination
        globalSource.connect(audioContext.destination);

        startBtn.disabled = true;
        stopBtn.disabled = false;
        statusText.innerText = "Status: Live (Streaming to Soundbar)";
      } catch (err) {
        alert("Microphone Access Denied or Error: " + err.message);
      }
    });

    stopBtn.addEventListener('click', () => {
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
      if (audioContext) {
        audioContext.close();
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
      statusText.innerText = "Status: Disconnected";
    });
  </script>
</body>
</html>
